        .hero-article {

            justify-content: center;

        }

        .hero-article-image {
            position: absolute;

            height: 100%;
            object-fit: cover;
        }

        .hero-article::after {
            content: "";

        .hero-caption {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);

        .article-container {
            max-width: 900px;
            margin: auto;
            padding: 80px 20px;

        .article-container p {
            font-size: 18px;
            line-height: 1.9;
            color: #444;
            margin-bottom: 25px;
        }

        .article-container.texto-duas-colunas {
            max-width: 1180px;
        }

        .article-container.texto-duas-colunas>p {
            column-count: 2;
            column-gap: 45px;
            text-align: justify;
            hyphens: none;
            -webkit-hyphens: none;
            -ms-hyphens: none;
            word-break: normal;
            overflow-wrap: normal;
        }

        .article-container .intro-highlight {
            color: #FD7D01;
            font-weight: 700;
        }

        @media (max-width: 767px) {
            .article-container.texto-duas-colunas>p {
                column-count: 1;
            }
        }

        .section-title {
            color: #FD7D01;
            font-size: 25px;
            margin: 60px 0 25px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .section-title span {
            display: block;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 90px;
            height: 4px;
            margin: 18px auto 0;
            background: linear-gradient(to right, #FD7D01 0 55%, #d6d6d6 55% 100%);
        }

        .img-premium {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;
            margin: 10px 0px 10px 0px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
        }

        .box-highlight {
            background: #faf7f2;
            padding: 40px;
            border-radius: 20px;
            margin: 60px 0;
            border-left: 6px solid #FD7D01;
        }

        .box-highlight.box-highlight--imagem {
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            color: #fff;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
        }

        .box-highlight.box-highlight--imagem .section-title,
        .box-highlight.box-highlight--imagem p {
            color: #fff;
        }

        .box-highlight.box-highlight--duas-colunas p {
            column-count: 2;
            column-gap: 45px;
        }

        .box-highlight--itens {
            padding: 48px;
        }

        .box-items {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            list-style: none;
            padding: 0;
            margin: 20px 0 0;
        }

        .box-items li {
            color: #fff;
            font-size: 17px;
            line-height: 1.35;
            text-align: center;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.088);
            backdrop-filter: blur(2px);
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin: 34px 0 58px;
            break-inside: avoid;
            column-span: all;
        }

        .service-card {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(250, 247, 242, 0.94));
            border: 1px solid rgba(253, 125, 1, 0.16);
            border-radius: 14px;
            padding: 24px 24px 22px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.07);
        }

        .service-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, #FD7D01, #9ed13b);
        }

        .service-card--featured {
            grid-column: 1 / -1;
            padding: 34px 38px;
            background:
                linear-gradient(135deg, rgba(21, 64, 47, 0.88), rgba(35, 94, 65, 0.74)),
                url("img/carroselViajarTravelNews/CARROSSEL - Pousada Rabo do Lagarto, a 2a melhor do Brasil.jpg") center/cover;
            color: #fff;
            border: 0;
        }

        .service-card--featured::before {
            width: 7px;
            background: linear-gradient(180deg, #FD7D01, #f6d26f, #9ed13b);
        }

        .service-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #78991f;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .service-card--featured .service-kicker {
            color: #f6d26f;
        }

        .service-name {
            margin: 0 0 10px;
            color: #FD7D01;
            font-size: 22px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .service-card--featured .service-name {
            color: #fff;
            font-size: 28px;
        }

        .article-container .service-card p {
            margin: 0;
            color: #344047;
            font-size: 17px;
            line-height: 1.65;
            text-align: left;
            column-count: 1;
        }

        .article-container .service-card--featured p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 18px;
        }

        .beer-box {
            position: relative;
            overflow: hidden;
            margin: 64px 0;
            padding: 48px;
            border-radius: 18px;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.34) 0 5px, transparent 6px),
                radial-gradient(circle at 88% 24%, rgba(255, 255, 255, 0.28) 0 7px, transparent 8px),
                radial-gradient(circle at 78% 74%, rgba(255, 255, 255, 0.22) 0 4px, transparent 5px),
                linear-gradient(135deg, #fff7e7 0%, #f7c66f 44%, #b56a1f 100%);
            box-shadow: 0 26px 60px rgba(120, 72, 18, 0.18);
            border: 1px solid rgba(181, 106, 31, 0.18);
            column-span: all;
            break-inside: avoid;
        }

        .beer-box::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 18px;
            background:
                radial-gradient(circle at 18px 0, #fff 0 18px, transparent 19px) repeat-x;
            background-size: 46px 22px;
            opacity: 0.72;
        }

        .beer-box .section-title {
            color: #5a3212;
            margin-top: 8px;
        }

        .article-container .beer-box p {
            column-count: 1;
            color: #3f2a16;
            font-size: 17px;
            line-height: 1.75;
            text-align: left;
        }

        .beer-box strong {
            color: #6f3e13;
        }

        .hotel-link-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin: 30px 0 58px;
            padding: 34px;
            background: linear-gradient(135deg, #f7fbff, #fff8f0);
            border: 1px solid rgba(253, 125, 1, 0.14);
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.06);
            column-span: all;
            break-inside: avoid;
        }

        .hotel-link-grid a {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            padding: 13px 14px;
            border-radius: 10px;
            background: #fff;
            color: #264653;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
            text-decoration: none;
            border: 1px solid rgba(38, 70, 83, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
        }

        .hotel-link-grid a:hover {
            color: #FD7D01;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 767px) {
            .box-highlight.box-highlight--duas-colunas p {
                column-count: 1;
            }

            .box-highlight--itens {
                padding: 32px 22px;
            }

            .box-items {
                grid-template-columns: 1fr;
            }

            .service-grid {
                grid-template-columns: 1fr;
            }

            .service-card,
            .service-card--featured {
                padding: 24px 22px;
            }

            .beer-box {
                padding: 38px 24px;
            }

            .hotel-link-grid {
                grid-template-columns: 1fr;
                padding: 24px;
            }
        }

        @keyframes pulsar {
            0% {
                transform: scale(1);
                filter: brightness(100%);
            }

            50% {
                transform: scale(1.1);
                filter: brightness(120%);
            }

            100% {
                transform: scale(1);
                filter: brightness(100%);
            }
        }
